name: MintImage Android Preview Build

on:
  push:
    branches:
      - work/local-customization
    paths:
      - .github/workflows/android-preview-build.yml
      - android/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Restore Android release signing when configured
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path('android/app/mint_image_release.jks').write_bytes(
              base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          values = {
              'storePassword': os.environ['ANDROID_STORE_PASSWORD'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'storeFile': 'mint_image_release.jks',
          }
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('android/key.properties').write_text(
              '\n'.join(f'{key}={escape(value)}' for key, value in values.items()) + '\n',
              encoding='utf-8')
          PY

      - name: Resolve dependencies on GitHub
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run regression tests
        run: flutter test --reporter expanded

      - name: Build universal Android APK
        run: >-
          flutter build apk --release
          --build-name 0.0.28
          --build-number "$((28000 + GITHUB_RUN_NUMBER))"
          --dart-define APP_VERSION=v0.0.28

      - name: Verify Android package and signature
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MintImage-Android-0.0.28.apk
          build_tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs dist/MintImage-Android-0.0.28.apk | tee dist/Android-APK-verification.txt
          "$build_tools/aapt" dump badging dist/MintImage-Android-0.0.28.apk | tee -a dist/Android-APK-verification.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          apk = Path('dist/MintImage-Android-0.0.28.apk')
          with zipfile.ZipFile(apk) as package:
              names = set(package.namelist())
              assert 'AndroidManifest.xml' in names, 'Missing Android manifest'
              assert 'lib/arm64-v8a/libapp.so' in names, 'Missing ARM64 Flutter app'
              assert 'lib/armeabi-v7a/libapp.so' in names, 'Missing ARM32 Flutter app'
              assert 'lib/x86_64/libapp.so' in names, 'Missing x86_64 Flutter app'
              assert any(name.startswith('assets/flutter_assets/') for name in names)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('dist/MintImage-Android-0.0.28.apk.sha256').write_text(
              f'{digest}  {apk.name}\n', encoding='utf-8')
          Path('dist/Android-build-info.json').write_text(json.dumps({
              'commit': os.environ['BUILD_COMMIT'],
              'version': '0.0.28',
              'package': 'com.aiqin.mint_image',
              'architectures': ['arm64-v8a', 'armeabi-v7a', 'x86_64'],
              'sha256': digest,
              'bytes': apk.stat().st_size,
              'signing': 'release' if os.environ.get('ANDROID_KEYSTORE_BASE64') else 'preview-debug',
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary release signing files
        if: always()
        run: rm -f android/key.properties android/app/mint_image_release.jks

      - uses: actions/upload-artifact@v6
        with:
          name: MintImage-Android-0.0.28
          path: dist/
          if-no-files-found: error
          retention-days: 30
